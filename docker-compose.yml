# Airflow + MLflow on Docker Desktop (Windows stays the host OS).
#   docker compose up --build -d
#   Airflow UI: http://localhost:8080     MLflow UI: http://localhost:5000
x-project: &project
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: wine-quality-mlops:latest

services:
  mlflow:
    <<: *project
    # The Airflow image's entrypoint would treat "mlflow" as an airflow subcommand.
    entrypoint: ["mlflow", "server"]
    command:
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artifacts
      - --serve-artifacts
      - --allowed-hosts=*
      - --disable-security-middleware
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow

  airflow:
    <<: *project
    command: standalone
    depends_on:
      - mlflow
    ports:
      - "8080:8080"
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_passwords.json
      AIRFLOW__API_AUTH__JWT_SECRET: local-dev-only-not-a-secret-change-me-32bytes
      PYTHONPATH: /opt/project
      # Same tracking server the browser sees on localhost:5000.
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: wine-quality-classification
      MLFLOW_DISABLE_AGENT_HINT: "1"
    volumes:
      - .:/opt/project
      - airflow-data:/opt/airflow

volumes:
  mlflow-data:
  airflow-data:
